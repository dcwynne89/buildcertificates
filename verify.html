<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Verify Certificate — BuildCertificates</title>
  <meta name="description" content="Verify the authenticity of a certificate generated by BuildCertificates.">
  <link rel="canonical" href="https://buildcertificates.com/verify.html">
  <link rel="stylesheet" href="styles.css">
  <style>
    .verify-container {
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }
    .verify-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
    }
    .verify-badge {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .verify-status {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .verify-status.valid { color: var(--success); }
    .verify-status.invalid { color: var(--error); }
    .verify-detail {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .verify-detail:last-child { border-bottom: none; }
    .verify-label { color: var(--text-muted); font-weight: 500; }
    .verify-value { color: var(--text-primary); font-weight: 600; }
    .verify-loading {
      color: var(--text-secondary);
      padding: 3rem 0;
    }
    .verify-back {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      background: var(--accent);
      color: #0a0b14;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .verify-back:hover { background: var(--accent-hover); color: #0a0b14; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">🏅 BuildCertificates</a>
    <div class="navbar-links">
      <a href="/api/docs">API Docs</a>
      <a href="/about.html">About</a>
    </div>
  </nav>

  <div class="verify-container">
    <div class="verify-card" id="verifyCard">
      <div class="verify-loading" id="verifyLoading">
        <div class="verify-badge">🔍</div>
        <p>Verifying certificate...</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2026 BuildCertificates · <a href="/api/docs">API</a> · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></p>
  </footer>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const card = document.getElementById("verifyCard");

      if (!id) {
        card.innerHTML = `
          <div class="verify-badge">❓</div>
          <div class="verify-status invalid">No Certificate ID</div>
          <p style="color:var(--text-muted);">Please scan a valid QR code or provide a certificate ID.</p>
          <a href="/" class="verify-back">← Create a Certificate</a>
        `;
        return;
      }

      try {
        const res = await fetch(`/api/v1/verify/${id}`);
        const data = await res.json();

        if (data.success && data.verified) {
          const c = data.certificate;
          card.innerHTML = `
            <div class="verify-badge">✅</div>
            <div class="verify-status valid">Certificate Verified</div>
            <div class="verify-detail"><span class="verify-label">Recipient</span><span class="verify-value">${c.recipient}</span></div>
            ${c.title ? `<div class="verify-detail"><span class="verify-label">Certificate</span><span class="verify-value">${c.title}</span></div>` : ""}
            ${c.course ? `<div class="verify-detail"><span class="verify-label">Course</span><span class="verify-value">${c.course}</span></div>` : ""}
            ${c.issuer ? `<div class="verify-detail"><span class="verify-label">Issued By</span><span class="verify-value">${c.issuer}</span></div>` : ""}
            ${c.dateIssued ? `<div class="verify-detail"><span class="verify-label">Date Issued</span><span class="verify-value">${c.dateIssued}</span></div>` : ""}
            <div class="verify-detail"><span class="verify-label">Verification ID</span><span class="verify-value" style="font-size:0.75rem;">${id}</span></div>
            <a href="/" class="verify-back">← Create Your Own</a>
          `;
        } else {
          card.innerHTML = `
            <div class="verify-badge">❌</div>
            <div class="verify-status invalid">Certificate Not Found</div>
            <p style="color:var(--text-muted);">This verification ID does not match any certificate in our records.</p>
            <a href="/" class="verify-back">← Create a Certificate</a>
          `;
        }
      } catch (e) {
        card.innerHTML = `
          <div class="verify-badge">⚠️</div>
          <div class="verify-status invalid">Verification Error</div>
          <p style="color:var(--text-muted);">Unable to verify at this time. Please try again later.</p>
          <a href="/" class="verify-back">← Back to Home</a>
        `;
      }
    })();
  </script>
</body>
</html>
